name: Diagnose live site
on: workflow_dispatch
jobs:
  curl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          home=$(curl -sS -m 30 https://dijivizit.com/)
          for t in "Tanışma kartla bitmez" "Kartınız iPhone" "Kâğıt kartvizit, saniyede kişi" "Özellikler"; do
            if grep -q "$t" <<<"$home"; then echo "::notice::found: $t"; else echo "::error::missing: $t"; fi
          done
          for f in app/favicon.ico public/ig/posts/09-uygulama-yok.jpg public/landing/lifestyle/hand.webp public/landing/finishes/black.webp public/landing/desktop/0100.webp public/rehber/metal-kartvizit.jpg public/rehber/kurumsal-dijital-kartvizit.jpg public/ig/posts/04-koleksiyon-black.jpg public/ig/posts/34-isigi-yakalayan.jpg public/ig/stories/06-dokun.jpg; do
            u="https://dijivizit.com/${f#public/}"; u="${u/app\//}"
            live=$(curl -sS -m 30 "$u" | sha256sum | cut -c1-12); repo=$(sha256sum "$f" | cut -c1-12)
            [ "$live" = "$repo" ] && echo "::notice::same: $u" || echo "::error::differs: $u ($live vs $repo)"
          done
          legal=$(curl -sS -m 30 https://dijivizit.com/yasal/kullanim-kosullari)
          grep -q 'name="robots" content="noindex' <<<"$legal" && echo "::notice::legal noindex: yes" || echo "::error::legal noindex: no"
          sm=$(curl -sS -m 30 https://dijivizit.com/sitemap.xml)
          grep -q "/yasal/" <<<"$sm" && echo "::error::sitemap still lists /yasal/" || echo "::notice::sitemap without /yasal/"
          grep -o "<title>[^<]*" <<<"$home" | head -1 | sed 's/^/::notice::home /'
          h=$(curl -sS -m 20 -o /dev/null -D - https://dijivizit.com/ | grep -iE "^(content-security-policy|x-frame-options|referrer-policy)" | tr -d '\r' | tr '\n' ' ')
          echo "::notice::headers: $h"
          c=$(curl -sS -m 20 -o /dev/null -w "%{http_code}" https://app.dijivizit.com/p/cuRuTp81gnM)
          echo "::notice::public card status: $c"
  secrets:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Worker secret names (values are never printed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          names=$(npx -y wrangler@4 secret list --name dijivizit --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).map(x=>x.name).join(",")))')
          echo "::notice::worker secrets: $names"
          echo "::notice::github ANTHROPIC_API_KEY set: $HAS_ANTHROPIC"
