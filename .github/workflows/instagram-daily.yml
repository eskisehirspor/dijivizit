name: Instagram daily post

# Publishing is manual: a daily Claude scheduled task shows the owner the next
# post on their phone and dispatches this workflow (dry_run=false,
# force_index=N) only after they approve it. The weekly schedule only
# refreshes the long-lived token, which lives in Supabase (integration_tokens).
on:
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be published"
        type: boolean
        default: true
      skip_story:
        description: "Publish the feed post only"
        type: boolean
        default: false
      refresh_token:
        description: "Refresh the Instagram token now"
        type: boolean
        default: false
      force_index:
        description: "Publish this entry number instead of today's (optional)"
        default: ""

permissions:
  contents: read

concurrency:
  group: instagram-daily

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Load or refresh access token
        env:
          SUPABASE_URL: https://mtspxgxgtvivkrbvlbuq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/ig-token.mjs ${{ (github.event_name == 'schedule' || inputs.refresh_token) && 'refresh' || 'load' }}

      - name: Publish
        if: github.event_name == 'workflow_dispatch'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE_INDEX: ${{ inputs.force_index }}
          SKIP_STORY: ${{ inputs.skip_story && '1' || '' }}
        run: node scripts/instagram-publish.mjs
